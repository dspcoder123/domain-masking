[build]
  publish = "."

# ─── Exception: serve local files before proxy catches them ──────────────────
# Google Search Console verification file must be served directly.
# Netlify processes redirects top-to-bottom — this rule runs first.

[[redirects]]
  from   = "/google6fa6039637cf1866.html"
  to     = "/google6fa6039637cf1866.html"
  status = 200
  force  = false

# ─── Server-side proxy rewrite ───────────────────────────────────────────────
# Every request to this Netlify site is silently forwarded to the real origin.
# The browser and search-engine crawlers only ever see the Netlify domain;
# the real Render URL is kept server-side and never appears in responses.

[[redirects]]
  from   = "/*"
  to     = "https://setupprints.onrender.com/:splat"
  status = 200
  force  = true

[redirects.headers]
  X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Cache-Control = "no-store, no-cache, must-revalidate"
